<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barclays | Banking for Everyone</title>
  <style>
/* ===== Base ===== */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  line-height: 1.6;
  color: #1a1a1a;
  background: #ffffff;
}

a {
  color: #00395d;
}

a:hover {
  text-decoration: underline;
}

/* Visible focus outline for keyboard users */
a:focus-visible,
button:focus-visible {
  outline: 3px solid #ffb81c;
  outline-offset: 3px;
}

.container {
  width: 90%;
  max-width: 1100px;
  margin: 0 auto;
}

/* ===== Header ===== */
.site-header {
  background: #00395d;
  color: #ffffff;
  padding: 16px 0;
}

.nav-wrap {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}

.logo {
  color: #ffffff;
  font-size: 1.5rem;
  font-weight: bold;
  text-decoration: none;
  letter-spacing: 2px;
}

.main-nav {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
}

.main-nav a {
  color: #ffffff;
  text-decoration: none;
  font-size: 0.95rem;
}

.main-nav a:hover {
  text-decoration: underline;
}

/* ===== Hero ===== */
.hero {
  background: #00aeef;
  color: #ffffff;
  padding: 80px 0;
  text-align: center;
}

.hero h1 {
  font-size: 2.5rem;
  margin-bottom: 16px;
}

.hero p {
  font-size: 1.15rem;
  margin-bottom: 28px;
  max-width: 600px;
  margin-left: auto;
  margin-right: auto;
}

/* ===== Buttons ===== */
.btn {
  display: inline-block;
  padding: 12px 26px;
  border-radius: 4px;
  text-decoration: none;
  font-weight: bold;
  transition: background 0.2s ease;
}

.btn-primary {
  background: #ffffff;
  color: #00395d;
}

.btn-primary:hover {
  background: #e6f4fb;
  text-decoration: none;
}

/* ===== Inner page content (Personal, Business, Contact) ===== */
.page-content {
  max-width: 760px;
  padding: 48px 0;
}

.page-content h2 {
  color: #00395d;
  font-size: 1.5rem;
  margin: 32px 0 10px;
  padding-top: 8px;
  border-top: 1px solid #d9e2e8;
}

.page-content h2:first-child {
  margin-top: 0;
  border-top: none;
  padding-top: 0;
}

.page-content p {
  margin-bottom: 12px;
  color: #333333;
}

/* ===== Footer ===== */
.site-footer {
  background: #f2f2f2;
  padding: 24px 0;
  margin-top: 40px;
  font-size: 0.9rem;
  color: #555555;
  text-align: center;
}

/* ===== Mobile ===== */
@media (max-width: 600px) {
  .hero h1 {
    font-size: 1.9rem;
  }

  .hero {
    padding: 56px 0;
  }

  .page-content {
    padding: 32px 0;
  }
}

/* Respect users who prefer less motion */
@media (prefers-reduced-motion: reduce) {
  .btn {
    transition: none;
  }
}
</style>
</head>
<body>

  <header class="site-header">
    <div class="container nav-wrap">
      <a href="index.html" class="logo">BARCLAYS</a>
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="pages/personal.html">Personal</a>
        <a href="pages/business.html">Business</a>
        <a href="pages/contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <section class="hero">
    <div class="container">
      <h1>Banking that works for you</h1>
      <p>Current accounts, savings, loans and mortgages, with support when you need it.</p>
      <a href="pages/personal.html" class="btn btn-primary">Explore personal banking</a>
    </div>
  </section>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Barclays demo project. Not affiliated with Barclays Bank PLC.</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
